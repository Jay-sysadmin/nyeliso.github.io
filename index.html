  <style>
    :root {
      --bg: #030910;
      --mint: #9ee8c6;
      --text: #ffffff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Hanken Grotesk', system-ui, sans-serif;
      overflow: hidden;
      min-height: 100vh;
    }

    .page {
      position: relative;
      height: 100vh;
      min-height: 560px;
      padding: 0 7vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo {
      position: absolute;
      top: 56px;
      left: 7vw;
      width: 42px;
      height: 42px;
    }

    .headline {
      font-size: clamp(2.2rem, 5.2vw, 4.8rem);
      font-weight: 300;
      line-height: 1.1;
      letter-spacing: -0.01em;
      max-width: 14ch;
    }
    .headline .name { color: var(--mint); }

    .subtitle {
      margin-top: 0.8rem;
      font-size: clamp(1.05rem, 2vw, 1.6rem);
      font-weight: 400;
    }

    .cta {
      margin-top: 3.5rem;
      display: inline-flex;
      align-items: center;
      gap: 1.4rem;
      width: fit-content;
      padding: 0.95rem 1.5rem;
      border: 1.5px solid var(--mint);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .cta svg { width: 48px; height: 16px; transition: transform 0.3s ease; }
    .cta:hover { background: var(--mint); color: var(--bg); }
    .cta:hover svg { transform: translateX(4px); }
    .cta:focus-visible { outline: 2px solid var(--mint); outline-offset: 4px; }

    .orb {
      position: absolute;
      right: 6%;
      top: 50%;
      transform: translateY(-50%);
      width: min(34vw, 480px);
      height: auto;
      pointer-events: none;
      filter: drop-shadow(0 0 40px rgba(158, 232, 198, 0.25));
      animation: float 7s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(-50%); }
      50%      { transform: translateY(calc(-50% - 14px)); }
    }

    .fade {
      opacity: 0;
      animation: fadeUp 0.8s ease forwards;
    }
    .fade.d1 { animation-delay: 0.1s; }
    .fade.d2 { animation-delay: 0.25s; }
    .fade.d3 { animation-delay: 0.4s; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .page { height: auto; padding: 8rem 1.5rem 5rem; }
      .logo { top: 2rem; left: 1.5rem; }
      .orb { position: relative; right: auto; top: auto; transform: none; width: 70%; margin: 3rem 0 0 auto; animation: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fade { animation: none; opacity: 1; }
      .orb { animation: none; }
      .cta, .cta svg { transition: none; }
    }
  </style>
