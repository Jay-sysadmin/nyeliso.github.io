<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Not Found | Likubangwa Jay-Z Nyeliso</title>
  <meta name="robots" content="noindex"/>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0a0f'/%3E%3Ctext x='32' y='43' font-family='monospace' font-size='26' font-weight='700' fill='%2300e5ff' text-anchor='middle'%3ELN%3C/text%3E%3C/svg%3E"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #07070e;
      --surface: #0e0e18;
      --border: #1a1a2e;
      --accent: #00e5ff;
      --accent2: #7c3aed;
      --text: #e8eaf6;
      --muted: #94a3b8;
      --green: #00c896;
      --red: #ff5f57;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 0;
    }
    .glow {
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,229,255,0.06) 0%, transparent 70%);
      top: -100px; left: 50%;
      transform: translateX(-50%);
      z-index: 0;
      pointer-events: none;
    }
    .term {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 620px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6);
    }
    .term-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.1rem;
      border-bottom: 1px solid var(--border);
      background: #13131f;
    }
    .term-dot { width: 10px; height: 10px; border-radius: 50%; }
    .term-dot.r { background: var(--red); }
    .term-dot.y { background: #febc2e; }
    .term-dot.g { background: #28c840; }
    .term-title {
      margin-left: 0.5rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
    .term-body { padding: 2.25rem 2rem; font-family: 'Space Mono', monospace; font-size: 0.85rem; line-height: 2; }
    .term-body .prompt { color: var(--green); }
    .term-body .path { color: var(--accent); }
    .term-line { color: var(--muted); white-space: pre-wrap; }
    .code404 {
      font-size: clamp(3rem, 10vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(0,229,255,0.6);
      margin: 1.25rem 0 0.5rem;
      font-family: 'Syne', sans-serif;
    }
    .err-msg { color: var(--red); margin-bottom: 1.75rem; }
    .term-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.5rem; }
    .term-link {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-decoration: none;
      padding: 0.65rem 1.1rem;
      border: 1px solid var(--border);
      color: var(--muted);
      transition: border-color 0.2s, color 0.2s;
    }
    .term-link:hover { border-color: var(--accent); color: var(--accent); }
    .term-link.primary { border-color: var(--accent); color: var(--accent); }
    .term-link.primary:hover { background: rgba(0,229,255,0.08); }
    .caret {
      display: inline-block;
      width: 7px; height: 14px;
      background: var(--accent);
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (max-width: 480px) {
      .term-actions { flex-direction: column; }
      .term-link { text-align: center; }
    }
  </style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="glow"></div>

  <div class="term">
    <div class="term-bar">
      <span class="term-dot r"></span><span class="term-dot y"></span><span class="term-dot g"></span>
      <span class="term-title">jay@nyeliso: ~</span>
    </div>
    <div class="term-body">
      <div><span class="prompt">guest@nyeliso</span>:<span class="path">~</span>$ <span id="reqPath">cd requested-page</span></div>
      <div class="term-line" id="errLine">bash: cd: requested-page: No such file or directory</div>
      <div class="code404">404</div>
      <div class="err-msg">Page not found on this host.</div>
      <div class="term-actions">
        <a href="portfolio.html" class="term-link primary">./portfolio.html</a>
        <a href="index.html" class="term-link">cd ~</a>
        <a href="mailto:jaynyeliso@gmail.com" class="term-link">mail jaynyeliso@gmail.com</a>
      </div>
      <div style="margin-top:1.5rem;"><span class="prompt">guest@nyeliso</span>:<span class="path">~</span>$ <span class="caret"></span></div>
    </div>
  </div>

  <script>
    try {
      const path = window.location.pathname.split('/').filter(Boolean).pop() || 'unknown';
      document.getElementById('reqPath').textContent = 'cd ' + path;
      document.getElementById('errLine').textContent = `bash: cd: ${path}: No such file or directory`;
    } catch (e) {}
  </script>

</body>
</html>
